name: Deploy

# Merging to main deploys. Nothing else does — there is no staging environment,
# so treat a merge here as a release.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. Two overlapping `docker compose up` runs on the
# same box will fight over the image names and the port bindings.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # The same checks every pull request runs. A merge that breaks them never
  # reaches the box, and a merge that skipped review still has to pass them.
  tests:
    uses: ./.github/workflows/tests.yml

  # The API and web images for this commit, built here rather than on the box:
  # a small server has no memory to spare for a Next.js build next to the live
  # site, and a build that fails here never touches it. Tagged with the commit,
  # so a rollback is a pull of the previous one.
  images:
    needs: tests
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Check the public API address
        # Baked into the web bundle, so it is set here, as a repository
        # variable, not in the box's .env. It must end in /_api (caddy/Caddyfile).
        env:
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
        run: |
          echo "$PUBLIC_API_URL" | grep -qE '^https://.+/_api/?$' \
            || { echo "::error::set the repository variable PUBLIC_API_URL to https://<domain>/_api"; exit 1; }

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ghcr.io/otunmartins/biologix-api:${{ github.sha }}
            ghcr.io/otunmartins/biologix-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          build-args: NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_API_URL }}
          tags: |
            ghcr.io/otunmartins/biologix-web:${{ github.sha }}
            ghcr.io/otunmartins/biologix-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    needs: [tests, images]
    # Off until the box exists. Set the repository variable DEPLOY_ENABLED=true
    # once it does (gh variable set DEPLOY_ENABLED --body true); until then a
    # merge shows this job as skipped rather than as a failed SSH login. A
    # variable, not a secret, because a job-level `if` cannot read secrets.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # packages: read lets this job's token log the box in to GHCR for the pull;
    # it expires with the job, so no registry credential is left on the box.
    permissions:
      contents: read
      packages: read
    env:
      APP_DIR: ${{ secrets.EC2_APP_DIR || '/home/ubuntu/biologix-2.0' }}
    steps:
      - name: Open an SSH session to the instance
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
          HOST_KEY: ${{ secrets.EC2_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${HOST_KEY:-}" ]; then
            # Pinned host key: the connection fails if the box's identity changes.
            printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
            echo "StrictHostKeyChecking=yes" >> ~/.ssh/config
          else
            # Trust on first use. Fine for a box you just created; set the
            # EC2_HOST_KEY secret (from `ssh-keyscan <ip>`) to pin it instead.
            echo "::warning::EC2_HOST_KEY not set - accepting the host key on first use"
            ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          cat >> ~/.ssh/config <<EOF
          Host target
            HostName $HOST
            User ${USER:-ubuntu}
            IdentityFile ~/.ssh/deploy_key
            ConnectTimeout 20
          EOF

      - name: Remember what is running now
        id: previous
        # The commit to roll back to if the new build comes up unhealthy.
        run: echo "sha=$(ssh target "cd '$APP_DIR' && git rev-parse HEAD")" >> "$GITHUB_OUTPUT"

      - name: Pull the new images and restart
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh target bash -euo pipefail <<EOF
            cd "$APP_DIR"

            # .env lives on the box and is NOT in the repo - never overwrite it.
            test -f .env || { echo "::error::no .env on the instance; deploy aborted"; exit 1; }

            # Campaigns and measurements live in Postgres. Checked before the reset
            # so a box without it keeps running the old build instead of a new one
            # that answers /health and fails every design iteration.
            grep -qE '^DATABASE_URL=.+' .env \
              || { echo "::error::DATABASE_URL missing from .env on the instance; deploy aborted"; exit 1; }

            # Sign-in. Without these the site comes up and nobody can get past
            # the sign-in screen, which /health cannot see.
            for var in AUTH_SECRET AUTH_GOOGLE_ID AUTH_GOOGLE_SECRET; do
              grep -qE "^\$var=.+" .env \
                || { echo "::error::\$var missing from .env on the instance; deploy aborted"; exit 1; }
            done

            # Exactly the commit whose images were just built: the compose file
            # and Caddyfile come from here, the code from the images.
            git fetch --prune origin
            git reset --hard "$SHA"

            # This job's token, good only until the job ends: pull, then log out.
            echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin >/dev/null
            IMAGE_TAG="$SHA" docker compose pull api web
            docker logout ghcr.io >/dev/null

            # APP_VERSION stamps every history record with this commit.
            # --no-build: the images are GitHub's, never compiled here.
            IMAGE_TAG="$SHA" APP_VERSION="${SHA:0:7}" docker compose up -d --no-build --remove-orphans

            # Caddy's image never changes, so compose leaves it running with the
            # Caddyfile it started with. Reload it, gracefully, so a Caddyfile
            # change in this commit takes effect; a bad one fails the deploy
            # here and the old config keeps serving.
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile

            # Every deploy leaves the previous images behind; the rollback
            # below pulls again if it needs them.
            docker image prune -af --filter "until=72h" >/dev/null
          EOF

      - name: Verify the API answers
        id: verify
        env:
          # Optional repository variable, e.g. https://biologix.app. When set, the
          # site is also checked from outside, through DNS, TLS and Caddy.
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          # Straight to the api container, not through Caddy: once SITE_ADDRESS
          # is a domain, Caddy answers localhost with an empty 308 to https,
          # which reads as a broken API and would roll every deploy back.
          health() {
            ssh target "cd '$APP_DIR' && docker compose exec -T api python -c 'import urllib.request; print(urllib.request.urlopen(\"http://localhost:8000/health\", timeout=10).read().decode())'"
          }
          ok=
          for attempt in $(seq 1 30); do
            if health > health.json 2>/dev/null && [ -s health.json ]; then ok=1; break; fi
            sleep 5
          done
          if [ -z "$ok" ]; then
            echo "::error::/health did not respond within 150s"
            ssh target "cd '$APP_DIR' && docker compose logs --tail 50" || true
            exit 1
          fi
          cat health.json
          # Up but keyless answers 200 and then fails every screen with 503,
          # which is a broken deploy that a plain health check calls healthy.
          grep -q '"model_configured":true' health.json \
            || { echo "::error::API is up but ANTHROPIC_API_KEY is not configured"; exit 1; }
          # Same trap with the database: a URL that is set but wrong (the
          # direct string instead of the pooled one, a dead Neon branch)
          # still answers 200 here. Reachable also means the sign-in tables exist.
          grep -q '"database":{"reachable":true}' health.json \
            || { echo "::error::API is up but cannot reach Postgres (see database in /health)"; exit 1; }
          # And the Tg model: without it the designer quietly falls back to
          # the handbook table instead of failing.
          grep -q '"tg_model":true' health.json \
            || { echo "::error::API is up but the Tg model did not load"; exit 1; }

          if [ -z "${SITE_URL:-}" ]; then
            echo "::warning::SITE_URL not set - checked the API only, not the public site"
            echo "::notice::deploy verified"
            exit 0
          fi
          # From outside: Caddy routes /health to the API and /api/auth to the
          # web app, the certificate is valid, and Google sign-in will call back
          # to this site - an AUTH_URL that does not match it (WEB_ORIGIN in
          # .env) makes every Google sign-in fail with redirect_uri_mismatch.
          # Retried because Caddy may still be fetching a certificate.
          site="${SITE_URL%/}"
          for attempt in $(seq 1 24); do
            if curl -fsS "$site/health" >/dev/null 2>&1 \
               && curl -fsS "$site/api/auth/providers" 2>/dev/null \
                  | grep -qF "\"callbackUrl\":\"$site/api/auth/callback/google\""; then
              echo "::notice::deploy verified, including $site and Google sign-in"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$site/health or /api/auth/providers did not answer correctly from outside"
          exit 1

      - name: Roll back to the previous build
        # Only when the new build was deployed and then failed its checks. The
        # site goes back to what was running before; the job still fails, so the
        # merge shows red and nobody mistakes the rollback for a release.
        if: failure() && steps.verify.conclusion == 'failure' && steps.previous.outputs.sha != ''
        env:
          PREV: ${{ steps.previous.outputs.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "::warning::rolling back to $PREV"
          # The previous deploy's images are still in GHCR under its commit.
          ssh target bash -euo pipefail <<EOF
            cd "$APP_DIR"
            git reset --hard "$PREV"
            echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin >/dev/null
            IMAGE_TAG="$PREV" docker compose pull api web
            docker logout ghcr.io >/dev/null
            IMAGE_TAG="$PREV" APP_VERSION="${PREV:0:7}" docker compose up -d --no-build --remove-orphans
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
          EOF
          for attempt in $(seq 1 30); do
            if ssh target "cd '$APP_DIR' && docker compose exec -T api python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\", timeout=10)'" >/dev/null 2>&1; then
              echo "::notice::rolled back to $PREV and it answers /health"
              exit 0
            fi
            sleep 5
          done
          echo "::error::rollback to $PREV did not come up either - the box needs a look"
          exit 1
