services:
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      # ":80" for plain HTTP on a bare IP, or your domain for automatic HTTPS.
      - SITE_ADDRESS=${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    environment:
      # Sign-in (web/auth.ts). Read at runtime, unlike NEXT_PUBLIC_API_URL, so
      # changing these needs a restart, not a rebuild.
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET}
      # The public address, for Google's callback URL and the cookie's Secure
      # flag. Must be explicit: behind Caddy, Next.js hands Auth.js its own
      # http://localhost:3000 whatever the forwarded headers say, and Google
      # rejects that callback as a redirect_uri_mismatch.
      - AUTH_URL=${WEB_ORIGIN}
      # Sessions live in the same Postgres the API checks them against.
      - DATABASE_URL=${DATABASE_URL}
      # Who may open /admin; the API checks the same list on every admin call.
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
    # The API creates the users and sessions tables at startup; a sign-in that
    # beat it there would fail on a missing table.
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./api
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - WEB_ORIGIN=${WEB_ORIGIN}
      - IID_CACHE_DIR=/cache
      - OPENFDA_API_KEY=${OPENFDA_API_KEY:-}
      # Postgres (Neon). The volume below no longer holds application data —
      # campaigns and measurements are in Postgres; /cache is only the FDA file.
      - DATABASE_URL=${DATABASE_URL}
      # The git commit this build came from, stamped on every history record
      # so a result can be traced to the exact code that produced it. The
      # deploy sets it; a hand-run `docker compose up` records 'dev'.
      - APP_VERSION=${APP_VERSION:-dev}
      # Shared secret for the simulation worker's /worker/* routes. Unset, those
      # routes answer 503 and nothing else changes.
      - WORKER_TOKEN=${WORKER_TOKEN:-}
      # Who approves simulations (comma-separated emails), and the RunPod pod an
      # approval starts. Without ADMIN_EMAILS nothing can be approved, so nothing runs.
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - RUNPOD_API_KEY=${RUNPOD_API_KEY:-}
      - RUNPOD_POD_ID=${RUNPOD_POD_ID:-}
    volumes:
      # The FDA Inactive Ingredient file is fetched once and reused for 30 days.
      # Without this it lands in the container's /tmp and is re-downloaded after
      # every restart, so the first screen back up waits on fda.gov.
      - iid_cache:/cache
    restart: unless-stopped

  # A CPU simulation worker (worker/): it takes the runs an admin approved as CPU
  # previews. `docker compose --profile worker up`, or COMPOSE_PROFILES=worker in
  # .env. Off by default because it is a multi-GB image. Full GPU runs happen on
  # a RunPod pod using the published image, which reaches the API by its public URL.
  worker:
    build: ./worker
    profiles: ["worker"]
    environment:
      - API_URL=http://api:8000
      - WORKER_TOKEN=${WORKER_TOKEN:-}
      - WORKER_NAME=${WORKER_NAME:-}
      - OPENMM_PLATFORM=${OPENMM_PLATFORM:-}
      - SIM_PRODUCTION_NS=${SIM_PRODUCTION_NS:-}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  iid_cache:
