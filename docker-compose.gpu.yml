# Gives the simulation worker the box's NVIDIA GPU. Layer it on the main file:
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# or set COMPOSE_FILE=docker-compose.yml:docker-compose.gpu.yml in .env so a plain
# `docker compose up` (and the deploy workflow) picks it up. Needs the NVIDIA
# driver and nvidia-container-toolkit on the host; check with
#   docker run --rm --gpus all nvidia/cuda:12.4.0-base-ubuntu22.04 nvidia-smi
services:
  worker:
    environment:
      - OPENMM_PLATFORM=CUDA
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
